services:
  - type: web
    name: snapworth
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/snapworth.db
      - key: SESSION_DB_DIR
        value: /var/data
    disk:
      name: snapworth-data
      mountPath: /var/data
      sizeGB: 1
